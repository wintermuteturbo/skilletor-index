<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>skilletor index</title>
  <meta name="description" content="Browse the agent skills in skilletor's public index and copy the command that installs one.">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="browse.css">
  <script src="browse.js" defer></script>
</head>
<body>
  <header>
    <h1>skilletor index</h1>
    <p>Agent skills from public git repositories. Find one, copy its command, and run it where <a href="https://skilletor.bartoldi.xyz">skilletor</a> is installed.</p>
  </header>
  <main>
    <label for="q">Search names and descriptions</label>
    <input id="q" type="search" placeholder="pdf, review, diagrams…" autocomplete="off" spellcheck="false">
    <p id="status" role="status" aria-live="polite">Loading the index…</p>
    <ol id="results"></ol>
  </main>
  <footer>
    <p>To add your skills, or to use this index with a skilletor that doesn't use it yet, see <a href="https://github.com/wintermuteturbo/skilletor-index#readme">the index's README</a>.</p>
  </footer>
</body>
</html>
